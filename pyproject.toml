[project]
name = "jevbench"
version = "0.1.0"
description = "Benchmark: TF-IDF vs LM embeddings vs TypeSafe Jev on 20 Newsgroups"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2",
    "pandas>=2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=3",
    "skrub>=0.10.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
jevbench = "jevbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbench"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
